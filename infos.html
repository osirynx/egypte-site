<script>
const ig = document.getElementById('infosGrid');
window.INFOS.forEach(info => {
  const el = document.createElement('article');
  el.className = 'info-card reveal';
  el.setAttribute('role', 'listitem');
  el.setAttribute('aria-label', info.t);
  el.innerHTML = `
    <span class="icon" aria-hidden="true">${info.ic}</span>
    <h2>${info.t}</h2>
    <ul>${info.items.map(x => `<li>${x}</li>`).join('')}</ul>`;
  ig.appendChild(el);
});

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.querySelectorAll('.info-card.reveal').forEach(el => {
      const io = new IntersectionObserver(es => {
        es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.disconnect(); } });
      }, {threshold: .12});
      io.observe(el);
    });
  }, 50);
});
</script>
