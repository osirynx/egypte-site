<body data-page="journal">

<main>
  <section class="page-head">
    <a href="index.html" class="back-link" aria-label="Retour à l'accueil">‹ Retour</a>
    <span class="eyebrow">Journal de bord</span>
    <h1>Le <i>Journal</i></h1>
    <div class="section-line" aria-hidden="true"></div>
    <p class="lead">Le récit jour après jour, de Nice à la Mer Rouge — anecdotes, coups de cœur et coups de fatigue.</p>
  </section>

  <div id="journalList" role="feed" aria-label="Journal de voyage"></div>
</main>

<script src="assets/data.js?v=8"></script>
<script defer src="assets/app.js?v=8"></script>
<script>
const jl = document.getElementById('journalList');
window.DAYS.forEach(d => {
  const sec = document.createElement('section');
  sec.className = 'day reveal';
  sec.id = d.id;
  sec.setAttribute('aria-label', d.no + ' — ' + d.date);

  let photos = '';
  if (d.photos.length) {
    const items = d.photos.map((p, k) =>
      `<div class="ph${k === 0 ? ' full' : ''}" data-img="${p}" role="button" tabindex="0" aria-label="Ouvrir la photo ${p + 1}">
        <img loading="lazy" src="${window.PHOTOS[p]}" alt="Photo du ${d.no} — ${d.date}"/>
      </div>`
    ).join('');
    photos = `<div class="day-photos">${items}</div>`;
  } else {
    photos = `<div class="day-photos"><div class="day-empty">« Pas d'image — seulement le souvenir. »</div></div>`;
  }

  sec.innerHTML = `<div class="day-grid">
    <div class="day-text">
      <span class="eyebrow">${d.date} · ${d.no}</span>
      <h2>${d.title}</h2>
      ${d.text.map(p => `<p>${p}</p>`).join('')}
    </div>
    ${photos}
  </div>`;
  jl.appendChild(sec);
});

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.querySelectorAll('.day.reveal').forEach(el => {
      const io = new IntersectionObserver(es => {
        es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.disconnect(); } });
      }, {threshold: .05});
      io.observe(el);
    });

    // Keyboard support for photo tiles
    document.querySelectorAll('.ph[tabindex]').forEach(ph => {
      ph.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ph.click(); }
      });
    });

    // Jump to anchor if present
    if (location.hash) {
      setTimeout(() => {
        const t = document.getElementById(location.hash.slice(1));
        if (t) window.scrollTo({top: t.offsetTop - 80, behavior: 'smooth'});
      }, 300);
    }
  }, 50);
});
</script>
