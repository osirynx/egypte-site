<body data-page="galerie">

<main>
  <section class="page-head">
    <a href="index.html" class="back-link" aria-label="Retour à l'accueil">‹ Retour</a>
    <span class="eyebrow">Photos du voyage</span>
    <h1>La <i>Galerie</i></h1>
    <div class="section-line" aria-hidden="true"></div>
    <p class="lead">Vingt-huit fragments du voyage — et neuf moments choisis qui resteront.</p>
  </section>

  <section class="galerie-wrap" id="galerie" aria-label="Mosaïque de photos">
    <div class="s-head reveal">
      <span class="eyebrow">Mosaïque</span>
      <h2>Vingt-huit <i>fragments</i></h2>
      <div class="section-line" aria-hidden="true"></div>
    </div>
    <div class="masonry" id="masonry" role="list"></div>
  </section>

  <section id="bestof" aria-label="Neuf moments impérissables">
    <div class="s-head reveal">
      <span class="eyebrow">Best Of</span>
      <h2>Neuf <i>moments</i> impérissables</h2>
      <div class="section-line" aria-hidden="true"></div>
    </div>
    <div class="bestof-grid" id="bestofGrid"></div>
  </section>
</main>

<script src="assets/data.js?v=8"></script>
<script src="assets/app.js?v=8"></script>
<script>
const masonry = document.getElementById('masonry');
const GALERIE_EXCLUDE = new Set([35, 36]);
window.PHOTOS.forEach((p, i) => {
  if (GALERIE_EXCLUDE.has(i)) return;
  const el = document.createElement('div');
  el.className = 'm-item';
  el.dataset.img = i;
  el.setAttribute('role', 'listitem');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', `Photo ${i + 1} — ouvrir en grand`);
  el.innerHTML = `<img loading="lazy" src="${p}" alt="Photo de voyage en Égypte ${i + 1}"/>`;
  masonry.appendChild(el);
});

const bo = document.getElementById('bestofGrid');
window.BESTOF.forEach(it => {
  const el = document.createElement('div');
  el.className = 'bo reveal';
  el.dataset.img = it.img;
  el.setAttribute('tabindex', '0');
  el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `${it.t} — ${it.d}`);
  el.innerHTML = `
    <img loading="lazy" src="${window.PHOTOS[it.img]}" alt="${it.t}"/>
    <div class="meta" aria-hidden="true">
      <span class="num">${it.n}</span>
      <span class="ttl">${it.t}</span>
      <span class="day-tag">${it.d}</span>
    </div>`;
  bo.appendChild(el);
});

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.querySelectorAll('.bo.reveal, .s-head.reveal').forEach(el => {
      const io = new IntersectionObserver(es => {
        es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.disconnect(); } });
      }, {threshold: .12});
      io.observe(el);
    });

    // Keyboard support
    document.querySelectorAll('.m-item[tabindex], .bo[tabindex]').forEach(el => {
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
      });
    });
  }, 50);
});
</script>
</body>
