<main>
  <section class="page-head">

    <span class="eyebrow">Chapitre V</span>
    <h1>La <i>Mythologie</i></h1>
    <div class="section-line" aria-hidden="true"></div>
    <p class="lead">Les dieux et déesses rencontrés au fil des temples — une cosmologie qui se dévoile.</p>
  </section>

  <section aria-label="Panthéon égyptien">
    <p class="mytho-intro reveal">« À travers les temples, les tombes et les hiéroglyphes, c'est toute une cosmologie qui se dévoile. Voici les dieux et déesses rencontrés au fil du voyage. »</p>

<!-- Myth Panel -->
<div class="myth-overlay" id="mythOverlay" aria-hidden="true"></div>
<div class="myth-panel" id="mythPanel" role="dialog" aria-modal="true" aria-labelledby="mythPanelTitle">
  <span class="myth-panel-handle" aria-hidden="true"></span>
  <button class="myth-panel-close" id="mythPanelClose" aria-label="Fermer">✕</button>
  <div class="myth-panel-content">
  <img class="myth-panel-img" id="mythPanelImg" alt="">
  <div class="myth-panel-body">
    <span class="eyebrow" id="mythPanelRole"></span>
    <h2 id="mythPanelTitle"></h2>
    <span class="myth-panel-epoch" id="mythPanelEpoch"></span>
    <p class="myth-panel-detail" id="mythPanelDetail"></p>
    <span class="myth-panel-vu" id="mythPanelVu"></span>
  </div>
  </div>
</div>

<script src="assets/data.js?v=11"></script>
<script src="assets/app.js?v=8"></script>
<script>
const mg = document.getElementById('mythoGrid');
window.GODS.forEach((g, i) => {
  const el = document.createElement('article');
  el.className = 'god reveal';
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', `${g.name} — ${g.role}. Cliquer pour en savoir plus.`);
  el.dataset.idx = i;
  el.innerHTML = `
    <div class="god-symbol" aria-hidden="true">${g.sym}</div>
    <span class="eyebrow">${g.role}</span>
    <h4>${g.name}</h4>
    <p>${g.text}</p>
    <span class="vu">${g.vu}</span>`;
  mg.appendChild(el);
});

// Panel open/close
const panel   = document.getElementById('mythPanel');
const overlay = document.getElementById('mythOverlay');
const pImg    = document.getElementById('mythPanelImg');
const pRole   = document.getElementById('mythPanelRole');
const pTitle  = document.getElementById('mythPanelTitle');
const pEpoch  = document.getElementById('mythPanelEpoch');
const pDetail = document.getElementById('mythPanelDetail');
const pVu     = document.getElementById('mythPanelVu');

// iOS scroll lock: prevent body touchmove when panel is open
function blockBodyScroll(e) {
  if (!panel.contains(e.target)) e.preventDefault();
}

function openPanel(g) {
  panel.style.display = '';
  overlay.style.display = '';
  pImg.style.display = '';
  pImg.src = '';
  pImg.alt = g.name;
  pImg.onerror = function() { this.style.display = 'none'; };
  pImg.onload  = function() { this.style.display = ''; };
  if (g.img) pImg.src = g.img;
  else pImg.style.display = 'none';
  pRole.textContent   = g.role;
  pTitle.textContent  = g.name;
  pEpoch.textContent  = g.epoch || '';
  pDetail.textContent = g.detail || g.text;
  pVu.textContent     = g.vu;
  panel.classList.add('open');
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  const scrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${scrollY}px`;
  document.body.style.width = '100%';
  document.body.dataset.scrollLockY = scrollY;
  document.addEventListener('touchmove', blockBodyScroll, {passive: false});
  panel.scrollTop = 0;
  setTimeout(() => document.getElementById('mythPanelClose').focus(), 50);
}

function closePanel() {
  panel.classList.remove('open');
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  const scrollY = +(document.body.dataset.scrollLockY || 0);
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  delete document.body.dataset.scrollLockY;
  window.scrollTo(0, scrollY);
  document.removeEventListener('touchmove', blockBodyScroll);
  setTimeout(() => {
    if (!panel.classList.contains('open')) {
      panel.style.display = 'none';
      overlay.style.display = 'none';
    }
  }, 450);
}

// Open on click / Enter / Space
mg.addEventListener('click', e => {
  const card = e.target.closest('[data-idx]');
  if (card) openPanel(window.GODS[+card.dataset.idx]);
});
mg.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const card = e.target.closest('[data-idx]');
    if (card) { e.preventDefault(); openPanel(window.GODS[+card.dataset.idx]); }
  }
});

// Close
document.getElementById('mythPanelClose').addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// Swipe down to close (mobile)
let touchStartY = 0;
panel.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, {passive:true});
panel.addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - touchStartY > 80 && panel.scrollTop === 0) closePanel();
}, {passive:true});

// Intersection observer for reveal
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.querySelectorAll('.god.reveal, .mytho-intro.reveal').forEach(el => {
      const io = new IntersectionObserver(es => {
        es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.disconnect(); } });
      }, {threshold: .12});
      io.observe(el);
    });
  }, 50);
});
</script>
