    <p class="lead">Les dieux et déesses rencontrés au fil des temples — une cosmologie qui se dévoile.</p>

  <section aria-label="Panthéon égyptien">
    <p class="mytho-intro reveal">« À travers les temples, les tombes et les hiéroglyphes, c'est toute une cosmologie qui se dévoile. Voici les dieux et déesses rencontrés au fil du voyage. »</p>

<script src="assets/data.js?v=8"></script>
<script src="assets/app.js?v=8"></script>
<script>
const mg = document.getElementById('mythoGrid');
window.GODS.forEach(g => {
  const el = document.createElement('article');
  el.className = 'god reveal';
  el.setAttribute('role', 'listitem');
  el.setAttribute('aria-label', `${g.name} — ${g.role}`);
  el.innerHTML = `
    <div class="god-symbol" aria-hidden="true">${g.sym}</div>
    <span class="eyebrow">${g.role}</span>
    <h2>${g.name}</h2>
    <p>${g.text}</p>
    <span class="vu">${g.vu}</span>`;
  mg.appendChild(el);
});

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.querySelectorAll('.god.reveal, .mytho-intro.reveal').forEach(el => {
      const io = new IntersectionObserver(es => {
        es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.disconnect(); } });
      }, {threshold: .12});
      io.observe(el);
    });
  }, 50);
});
</script>
