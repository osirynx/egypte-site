<script>
const SECTIONS = [
  {n:'I',   t:"<i>Destinations</i>",          d:"Guides complets de voyage : Le Caire, Louxor, Assouan, Abou Simbel, Croisière Nil, Mer Rouge.",  href:'le-caire.html',    img:5},
  {n:'II',  t:"La <i>Mythologie</i>",          d:"Les dieux et déesses de l'Égypte antique — Osiris, Isis, Horus, Anubis, Râ et les autres.",      href:'mythologie.html',  img:7},
  {n:'III', t:"Infos <i>pratiques</i>",        d:"Visa, budget, santé, transports, météo — tout pour préparer votre voyage en Égypte.",              href:'infos.html',       img:4},
  {n:'IV',  t:"La <i>Galerie</i>",             d:"Les plus belles photos du voyage — temples, désert, Nil et Mer Rouge.",                            href:'galerie.html',     img:30},
  {n:'V',   t:"Mon <i>Voyage</i>",             d:"Le récit complet, l'itinéraire jour par jour et la carte interactive de notre circuit en Égypte.", href:'journal.html',     img:8},
  {n:'VI',  t:"La <i>Carte</i>",               d:"L'itinéraire tracé de la Méditerranée à la Mer Rouge, ville par ville.",                           href:'carte.html',       img:3},
];

const eg = document.getElementById('explorerGrid');
SECTIONS.forEach(s => {
  const a = document.createElement('a');
  a.className = 'ex-card reveal';
  a.href = s.href;
  a.setAttribute('aria-label', s.t.replace(/<[^>]+>/g, '') + ' — ' + s.d);
  a.innerHTML = `
    <div class="bg" style="background-image:url('${window.PHOTOS[s.img]}')" aria-hidden="true"></div>
    <div class="arrow" aria-hidden="true">→</div>
    <div class="body">
      <span class="num">${s.n}</span>
      <div class="ttl">${s.t}</div>
      <p class="desc">${s.d}</p>
    </div>`;
  eg.appendChild(a);
});

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.querySelectorAll('.ex-card.reveal').forEach(el => {
      const io = new IntersectionObserver(es => {
        es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.disconnect(); } });
      }, {threshold: .12});
      io.observe(el);
    });
  }, 50);
});
</script>
