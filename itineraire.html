    <span class="eyebrow">Mon Voyage</span>
    <h1>L'<i>Itinéraire</i></h1>
    <div class="section-line" aria-hidden="true"></div>
    <p class="lead">Quatorze jours, cinq escales, du Caire à la Mer Rouge — la chronologie complète du voyage.</p>
  </section>

  <section style="padding-top:3rem" aria-label="Timeline du voyage">
    <div class="timeline" id="timeline" role="list"></div>
  </section>

<script src="assets/data.js?v=8"></script>
<script src="assets/app.js?v=8"></script>
<script>
const tl = document.getElementById('timeline');
window.TIMELINE.forEach(it => {
  const el = document.createElement('div');
  el.className = 'tl-item reveal';
  el.setAttribute('role', 'listitem');
  el.innerHTML = `
    <div class="dot" aria-hidden="true"></div>
    <a class="card" href="journal.html#${it.target}" aria-label="${it.place} — ${it.date}">
      <span class="day-no">${it.n}</span>
      <h2 class="place">${it.place}</h2>
      <span class="date">${it.date}</span>
      <p class="summary">${it.sum}</p>
    </a>`;
  tl.appendChild(el);
});
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    document.querySelectorAll('.tl-item.reveal').forEach(el => {
      const io = new IntersectionObserver(es => {
        es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.disconnect(); } });
      }, {threshold: .12});
      io.observe(el);
    });
  }, 50);
});
</script>
