<style>
  .pop-btns {display:flex;flex-direction:column;gap:.4rem;margin-top:.6rem}

    display: inline-block;
    padding: .25rem .7rem;

    transition: background .2s;
  }
  .pop-city-btn:hover {background: #e0bc5e}
  .pop-journal-btn {
    display: inline-block;
    padding: .25rem .7rem;
    border: 1px solid #C9A84C;
    color: #C9A84C;

<body data-page="carte">

<main>
  <section class="page-head">
    <a href="index.html" class="back-link" aria-label="Retour à l'accueil">‹ Retour</a>
    <span class="eyebrow">Chapitre IV</span>
    <h1>La <i>Carte</i></h1>
    <div class="section-line" aria-hidden="true"></div>
    <p class="lead">De la Méditerranée à la Mer Rouge — l'itinéraire tracé sur la carte.</p>
  </section>

  <section aria-label="Carte interactive du voyage">
    <div id="map" role="application" aria-label="Carte du voyage en Égypte — cliquez sur les marqueurs pour les détails"></div>
    <div class="legend" aria-label="Légende">
      <span><span class="legend-dot" aria-hidden="true"></span>Étape du voyage</span>
      <span><span class="legend-line" aria-hidden="true"></span>Trajet chronologique</span>
    </div>
    <div class="places-list" id="placesList" role="list" aria-label="Liste des étapes"></div>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/data.js?v=12"></script>
<script src="assets/app.js?v=8"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const map = L.map('map', {
    center: [26.5, 30.5],
    zoom: 6,
    scrollWheelZoom: false,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.webp', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  const placeByName = Object.fromEntries(window.PLACES.map(p => [p.name, p]));

  window.PLACES.forEach(p => {
    const icon = L.divIcon({
      className: '',
      html: '<div class="gold-marker"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });
    const m = L.marker(p.coords, {icon, alt: p.name}).addTo(map);
    m.bindPopup(`<span class="pop-day">${p.days}</span><h4>${p.name}</h4><div>${p.desc}</div><div class="pop-btns">${p.cityPage ? `<a href="${p.cityPage}" class="pop-city-btn">En savoir plus →</a>` : ''}${p.journal ? `<a href="${p.journal}" class="pop-journal-btn">Lire le journal →</a>` : ''}</div>`);
  });

  const routeCoords = window.ROUTE_ORDER.map(n => placeByName[n].coords);
  L.polyline(routeCoords, {
    color: '#C9A84C',
    weight: 1.5,
    opacity: .85,
    dashArray: '4,8'
  }).addTo(map);

  map.on('click', () => map.scrollWheelZoom.enable());
  map.on('mouseout', () => map.scrollWheelZoom.disable());

  const pl = document.getElementById('placesList');
  window.PLACES.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'place-row reveal';
    el.setAttribute('role', 'listitem');
    el.innerHTML = `
      <span class="pn" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>
      <div>
        <h2>${p.name}</h2>
        <span class="pday">${p.days}</span>
        <p>${p.desc}</p>
        ${p.journal ? `<a href="${p.journal}" class="place-journal-link">Lire le journal →</a>` : ''}
      </div>`;
    pl.appendChild(el);
  });

  setTimeout(() => {
    document.querySelectorAll('.place-row.reveal').forEach(el => {
      const io = new IntersectionObserver(es => {
        es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.disconnect(); } });
      }, {threshold: .12});
      io.observe(el);
    });
  }, 50);
});
</script>
</body>
